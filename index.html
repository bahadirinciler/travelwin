<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6e79" />
  <title>TravelWin — Turizm Affiliate Platformu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="TravelWin ana sayfa">
      <span class="brand-mark">TW</span>
      <span class="brand-name">Travel<b>Win</b></span>
    </a>
    <nav class="topnav" id="topnav" aria-label="Ana menü"></nav>
    <div class="topbar-right">
      <div class="role-switch" id="roleSwitch" role="tablist" aria-label="Rol seçimi">
        <button data-role="creator" role="tab">Üretici</button>
        <button data-role="business" role="tab">İşletme</button>
      </div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <nav class="bottomnav" id="bottomnav" aria-label="Mobil menü"></nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
